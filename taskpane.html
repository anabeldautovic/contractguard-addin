<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContractGuard</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <h1>ContractGuard</h1>

  <button class="btn" id="run" disabled>Run review</button>
  <div id="confirm" class="form" hidden></div>
  <div id="status">Loading…</div>
  <div class="tabs">
    <button class="tab on" data-tab="changes">Changes</button><button class="tab" data-tab="rules">Rulebook</button><button class="tab" data-tab="log">Log</button>
  </div>
  <div id="result"></div>
  <div id="rules" hidden></div>
  <div id="log" hidden></div>

  <button class="linkbtn" id="clear" disabled>Remove ContractGuard’s comments (yours stay)…</button>

  <div class="foot">Panel version 24</div>

<script>
  // Always load the newest rules, code and styles, so Word never shows an old copy.
  (function () {
    var v = Date.now();
    var css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "taskpane.css?v=" + v;
    document.head.appendChild(css);
    function load(src, next) {
      var s = document.createElement("script");
      s.src = src + "?v=" + v; s.onload = next;
      document.body.appendChild(s);
    }
    load("template.js", function () { load("rules.js", function () { load("taskpane.js"); }); });
  })();
</script>
</body>
</html>
